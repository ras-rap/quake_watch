name: Build Apple Watch App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: List Xcode Schemes
        run: |
          if [ -f *.xcworkspace ]; then
            xcodebuild -list -workspace *.xcworkspace
          else
            xcodebuild -list -project *.xcodeproj
          fi

      - name: Download Quake assets
        run: |
          chmod +x download_shareware_assets.sh
          ./download_shareware_assets.sh

      - name: Build and archive
        run: |
          xcodebuild -scheme "qwatch WatchKit App" -sdk iphoneos -configuration Release archive -archivePath $PWD/build/App.xcarchive
      - name: Export .ipa
        run: |
          # Create a minimal ExportOptions.plist for ad-hoc export
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
            <key>destination</key>
            <string>export</string>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $PWD/build

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: watch-app-ipa
          path: build/*.ipa
